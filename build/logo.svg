<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3584e8"/>
      <stop offset="1" stop-color="#143f94"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe3d"/>
      <stop offset="1" stop-color="#f28c0f"/>
    </linearGradient>
    <filter id="schaduw" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a2259" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tegel -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg)"/>
  <circle cx="420" cy="92" r="150" fill="#ffffff" opacity="0.06"/>

  <!-- telefoon -->
  <g transform="rotate(-9 236 262)" filter="url(#schaduw)">
    <rect x="140" y="88" width="196" height="344" rx="38" fill="#ffffff"/>
    <rect x="157" y="120" width="162" height="280" rx="14" fill="#e3edfc"/>
    <rect x="210" y="102" width="56" height="8" rx="4" fill="#b7c9e6"/>
    <!-- advertentie op het scherm -->
    <rect x="173" y="138" width="130" height="92" rx="10" fill="#bcd3f5"/>
    <path d="M188 214 l30 -34 l22 22 l14 -14 l34 26 z" fill="#8fb3ea"/>
    <circle cx="276" cy="164" r="11" fill="#8fb3ea"/>
    <rect x="173" y="246" width="118" height="13" rx="6.5" fill="#1d5fbf"/>
    <rect x="173" y="270" width="86" height="11" rx="5.5" fill="#9fb8de"/>
    <rect x="173" y="292" width="102" height="11" rx="5.5" fill="#9fb8de"/>
    <rect x="173" y="336" width="130" height="34" rx="10" fill="#1d5fbf"/>
    <rect x="203" y="349" width="70" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- prijslabel -->
  <g transform="translate(318 318) rotate(-22)" filter="url(#schaduw)">
    <path d="M-62 -38 H52 a18 18 0 0 1 18 18 V20 a18 18 0 0 1 -18 18 H-62 L-104 0 Z" fill="url(#tag)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="-66" cy="0" r="10" fill="#ffffff"/>
    <text x="8" y="17" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="50" fill="#ffffff">€</text>
  </g>
</svg>
